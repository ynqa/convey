    allow_empty: false
    candidates:
      values: [reached-the-end, not-reached]

output:
  template: |
    # Input field overflow check

    - First field: {{ inputs.field_01_top_marker }}
    - Initial viewport boundary: {{ inputs.field_15_near_initial_viewport_end }}
    - First field below the initial viewport: {{ inputs.field_16_below_initial_viewport }}
    - 24-row marker: {{ inputs.field_24_terminal_24_marker }}
    - After 24 rows: {{ inputs.field_25_after_terminal_24 }}
    - Midpoint: {{ inputs.field_32_midpoint_marker }}
    - 40-row marker: {{ inputs.field_40_terminal_40_marker }}
    - After 40 rows: {{ inputs.field_41_after_terminal_40 }}
    - Last field: {{ inputs.field_64_last_marker }}
