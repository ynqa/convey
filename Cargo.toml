[package]
name = "convey"
version = "0.1.0"
authors = ["ynqa <un.pensiero.vano@gmail.com>"]
edition = "2024"
description = "Compose and send prompts to terminal sessions"
homepage = "https://github.com/ynqa/convey"
repository = "https://github.com/ynqa/convey"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["derive"] }
futures = "0.3.32"
handlebars = "6.4.3"
promkit = { version = "0.15.0", features = ["spinner", "terminal-session", "text", "texteditor"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["macros", "process", "rt", "sync", "time"] }

[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
